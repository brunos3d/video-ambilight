name: Release

# Manual releases through Nx release. Runs as a dry run unless `publish` is set
# and the NPM_TOKEN secret exists. Versions follow conventional commits.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (requires NPM_TOKEN secret). Leave unchecked for a dry run.'
        type: boolean
        default: false
      version:
        description: 'Explicit version or bump (patch, minor, major, prerelease). Empty derives from commits.'
        type: string
        default: ''

env:
  NX_DAEMON: 'false'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Configure git for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build, verify and dry-run release
        if: ${{ !inputs.publish }}
        run: |
          pnpm exec nx run-many -t build --projects='packages/*'
          node tools/scripts/verify-packages.mjs
          pnpm exec nx release --dry-run ${{ inputs.version }}

      - name: Version, changelog and publish
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec nx run-many -t build --projects='packages/*'
          node tools/scripts/verify-packages.mjs
          pnpm exec nx release ${{ inputs.version }} --yes
